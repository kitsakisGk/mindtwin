[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mindtwin"
version = "0.0.1"
description = "An open-source framework for industrial Cognitive Digital Twins"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "George Kitsakis" }]
requires-python = ">=3.10"
keywords = ["digital twin", "cognitive digital twin", "knowledge graph", "prognostics", "predictive maintenance", "llm agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.6",
    "rdflib>=7.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
experiments = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/kitsakisGk/mindtwin"
Issues = "https://github.com/kitsakisGk/mindtwin/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mindtwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
